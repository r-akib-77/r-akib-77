    rakib@dev:~$
  </text>

  <rect
    x="180"
    y="494"
    width="9"
    height="20"
    fill="#38BDF8"
  >

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />

  </rect>

