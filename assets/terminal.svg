    rakib_NP
  </text>

  <!-- Status -->

  <text
    x="45"
    y="430"
    fill="#38BDF8"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    rakib@dev:~$ echo $STATUS
  </text>

  <circle
    cx="53"
    cy="458"
    r="5"
    fill="#22C55E"
