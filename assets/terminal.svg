    Competitive Programmer
  </text>

  <!-- Command 3 -->

  <text
    x="45"
    y="300"
    fill="#38BDF8"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    rakib@dev:~$ echo $TEAM
  </text>

  <text
    x="45"
    y="325"
    fill="#F8FAFC"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
