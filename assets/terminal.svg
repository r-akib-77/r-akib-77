    Null Pointer
  </text>

  <!-- Command 4 -->

  <text
    x="45"
    y="365"
    fill="#38BDF8"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    rakib@dev:~$ echo $CODEFORCES
  </text>

  <text
    x="45"
    y="390"
    fill="#F8FAFC"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
