<svg
  width="900"
  height="560"
  viewBox="0 0 900 560"
  xmlns="http://www.w3.org/2000/svg"
>

  <rect
    width="900"
    height="560"
    rx="16"
    fill="#020617"
  />

  <rect
    x="2"
    y="2"
    width="896"
    height="556"
    rx="14"
    fill="none"
    stroke="#164E63"
    stroke-width="2"
  />

  <!-- Terminal header -->

  <circle cx="30" cy="30" r="6" fill="#EF4444"/>
  <circle cx="52" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="74" cy="30" r="6" fill="#22C55E"/>

  <text
    x="450"
    y="36"
    text-anchor="middle"
    fill="#64748B"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="13"
