    Rakibul Hasan Rakib
  </text>

  <!-- Command 2 -->

  <text
    x="45"
    y="160"
    fill="#38BDF8"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    rakib@dev:~$ cat ./profile
  </text>

  <text
    x="45"
    y="185"
    fill="#CBD5E1"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
