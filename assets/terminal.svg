    rakib@dev — terminal
  </text>

  <line
    x1="20"
    y1="58"
    x2="880"
    y2="58"
    stroke="#164E63"
    stroke-width="1"
  />

  <!-- Command 1 -->

  <text
    x="45"
    y="95"
    fill="#38BDF8"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
