    Full-Stack Engineer
  </text>

  <text
    x="45"
    y="210"
    fill="#CBD5E1"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    Product Builder
  </text>

  <text
    x="45"
    y="235"
    fill="#CBD5E1"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
  >
    AI / MCP Engineer
  </text>

  <text
    x="45"
    y="260"
    fill="#CBD5E1"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="15"
