<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="accent" x1="40" y1="0" x2="900" y2="220">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#164E63" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="220" rx="20" fill="#020617"/>
  <rect width="1000" height="220" rx="20" fill="url(#grid)"/>

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="998"
    height="218"
    rx="19"
    stroke="#164E63"
    stroke-width="2"
  />

  <!-- Accent -->
  <rect
    x="30"
    y="28"
    width="5"
    height="164"
    rx="2.5"
    fill="url(#accent)"
  />

  <!-- Crown -->
  <text
    x="62"
    y="70"
    fill="#FACC15"
    font-family="Arial, sans-serif"
    font-size="32"
  >♛</text>

  <!-- Label -->
  <text
    x="108"
    y="58"
    fill="#64748B"
    font-family="Fira Code, monospace"
    font-size="13"
    font-weight="600"
    letter-spacing="2"
  >
    COMPETITIVE PROGRAMMING TEAM
  </text>

  <!-- BIG TEAM NAME -->
  <text
    x="105"
    y="108"
    fill="#F8FAFC"
    font-family="Fira Code, monospace"
    font-size="40"
    font-weight="700"
  >
    NULL POINTER
  </text>

  <!-- Team Leader label -->
  <text
    x="108"
    y="145"
    fill="#38BDF8"
    font-family="Fira Code, monospace"
    font-size="16"
    font-weight="700"
  >
    TEAM LEADER
  </text>

  <!-- Leader name -->
  <text
    x="108"
    y="174"
    fill="#CBD5E1"
    font-family="Fira Code, monospace"
    font-size="19"
    font-weight="600"
  >
    Rakibul Hasan Rakib
  </text>

  <!-- Right panel -->
  <rect
    x="725"
    y="48"
    width="235"
    height="124"
    rx="14"
    fill="#071525"
    stroke="#164E63"
    stroke-width="2"
  />

  <!-- Active indicator -->
  <circle
    cx="753"
    cy="76"
    r="6"
    fill="#22C55E"
    filter="url(#glow)"
  />

  <text
    x="770"
    y="82"
    fill="#22C55E"
    font-family="Fira Code, monospace"
    font-size="13"
    font-weight="700"
  >
    ACTIVE TEAM
  </text>

  <!-- Codeforces -->
  <text
    x="752"
    y="113"
    fill="#64748B"
    font-family="Fira Code, monospace"
    font-size="11"
  >
    CODEFORCES
  </text>

  <text
    x="752"
    y="140"
    fill="#38BDF8"
    font-family="Fira Code, monospace"
    font-size="20"
    font-weight="700"
  >
    @rakib_NP
  </text>

  <text
    x="752"
    y="160"
    fill="#64748B"
    font-family="Fira Code, monospace"
    font-size="10"
  >
    THINK → CODE → DEBUG → AC
  </text>

</svg>