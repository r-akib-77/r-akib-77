<svg width="210" height="42" viewBox="0 0 210 42" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0%" stop-color="#16A34A"/>
    <stop offset="100%" stop-color="#22C55E"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="210" height="42" rx="10" fill="#020617"/>
<rect x="1" y="1" width="208" height="40" rx="9"
      fill="none" stroke="#164E63"/>

<rect x="1" y="1" width="4" height="40" rx="2"
      fill="url(#g)"
      filter="url(#glow)"/>

<circle cx="25" cy="21" r="8"
        fill="#22C55E"
        fill-opacity=".12"
        stroke="#22C55E"/>

<path d="M21 21L24 24L30 17"
      stroke="#22C55E"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"/>

<text x="43" y="26"
      fill="#F8FAFC"
      font-family="Fira Code, monospace"
      font-size="13"
      font-weight="700"
      letter-spacing=".5">
  OPEN TO BUILD
</text>

<circle cx="192" cy="21" r="3"
        fill="#22C55E"
        filter="url(#glow)">
  <animate
    attributeName="opacity"
    values="1;.35;1"
    dur="1.8s"
    repeatCount="indefinite"/>
</circle>

</svg>