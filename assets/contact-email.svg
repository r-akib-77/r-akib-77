<svg width="310" height="46" viewBox="0 0 310 46" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="emailGradient" x1="0" x2="1">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#164E63"/>
  </linearGradient>

  <filter id="emailGlow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="310" height="46" rx="12" fill="#020617"/>

<rect
  x="1"
  y="1"
  width="308"
  height="44"
  rx="11"
  fill="url(#emailGradient)"
  stroke="#164E63"
/>

<!-- Email icon -->

<rect
  x="16"
  y="14"
  width="24"
  height="18"
  rx="4"
  fill="#38BDF8"
  fill-opacity=".08"
  stroke="#38BDF8"
/>

<path
  d="M18 17L28 25L38 17"
  stroke="#38BDF8"
  stroke-width="1.6"
  fill="none"
  stroke-linecap="round"
  stroke-linejoin="round"
/>

<text
  x="53"
  y="20"
  fill="#64748B"
  font-family="Fira Code, monospace"
  font-size="10"
  font-weight="600">
  EMAIL
</text>

<text
  x="53"
  y="34"
  fill="#F8FAFC"
  font-family="Fira Code, monospace"
  font-size="12"
  font-weight="700">
  rakibulhasanrakib2004@gmail.com
</text>

<circle
  cx="291"
  cy="23"
  r="4"
  fill="#22D3EE"
  filter="url(#emailGlow)">

  <animate
    attributeName="opacity"
    values="1;.25;1"
    dur="2.2s"
    repeatCount="indefinite"/>

</circle>

</svg>