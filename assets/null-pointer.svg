<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="300" rx="12" fill="#020617"/>

  <rect
    x="2"
    y="2"
    width="696"
    height="296"
    rx="10"
    fill="none"
    stroke="#164E63"
    stroke-width="2"
  />

  <text
    x="350"
    y="55"
    text-anchor="middle"
    fill="#38BDF8"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="22"
    font-weight="700"
  >
    NULL POINTER
  </text>

  <text
    x="70"
    y="105"
    fill="#CBD5E1"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="17"
  >
    $ solve --problem
  </text>

  <text
    x="70"
    y="140"
    fill="#CBD5E1"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="17"
  >
    $ compile --optimized
  </text>

  <text
    x="70"
    y="175"
    fill="#CBD5E1"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="17"
  >
    $ debug --until=AC
  </text>

  <text
    x="70"
    y="210"
    fill="#CBD5E1"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="17"
  >
    $ submit
  </text>

  <circle cx="73" cy="250" r="6" fill="#22C55E"/>

  <text
    x="90"
    y="256"
    fill="#22C55E"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="16"
    font-weight="700"
  >
    ONLINE
  </text>

  <text
    x="610"
    y="256"
    text-anchor="end"
    fill="#22C55E"
    font-family="JetBrains Mono, Fira Code, monospace"
    font-size="16"
    font-weight="700"
  >
    [ AC ✓ ]
  </text>
</svg>